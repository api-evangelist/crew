name: Crew
description: 'Crew is a digital workplace platform for frontline and deskless teams, connecting
  frontline staff to corporate leadership across distributed workforces. The product bundles
  real-time team communication and employee engagement, labor optimization and shift scheduling,
  task execution, culture and recognition, knowledge management, a Command Center for administration
  and analytics, a compliance and safety suite, and third-party integrations. Crew reports serving
  more than one million frontline workers across companies including Taco Bell, Wendy''s, Planet
  Fitness, and Harps Foods. It is backed by Greylock and was added to the API Evangelist network as a
  portfolio lead; no public API, developer portal, or technical documentation surface was found during
  enrichment.'
